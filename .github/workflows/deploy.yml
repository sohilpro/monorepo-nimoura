name: Direct Deploy Monorepo to Iran Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Changed Files to Iran Server via SSH (Port 9011)
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude='.git/' --exclude='.env' --exclude='node_modules/' --exclude='nginx/' --exclude='docker/' --exclude='docker-compose.prod.yml' --exclude='apps/api/uploads/'
          path: ./
          remote_path: /opt/monorepo-nimoura/
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_port: 9011
          remote_user: root
          remote_key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Rebuild and Restart Containers on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 9011
          command_timeout: 20m
          script: |
            set -e
            cd /opt/monorepo-nimoura
            find apps/api/scripts apps/api/src -name '*.ts' -exec sed -i 's/migrationsRun:[[:space:]]*true/migrationsRun: false/g' {} +
            docker compose -f docker-compose.prod.yml up -d --build api admin web
            docker image prune -f