name: Build & Push Monorepo to Iranian Registry

on:
  push:
    branches:
      - main

env:
  # آدرس رجیستری داخلی ایران (مثال: رجیستری آروان کلود)
  REGISTRY_URL: crcr.ir
  REGISTRY_NAMESPACE: ${{ secrets.REGISTRY_NAMESPACE }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Iranian Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push API (NestJS)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY_URL }}/${{ env.REGISTRY_NAMESPACE }}/nimoura-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and Push Admin (Nuxt)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/admin
          file: ./apps/admin/Dockerfile
          push: true
          tags: ${{ env.REGISTRY_URL }}/${{ env.REGISTRY_NAMESPACE }}/nimoura-admin:latest
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

      - name: Build and Push Web Storefront
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY_URL }}/${{ env.REGISTRY_NAMESPACE }}/nimoura-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web