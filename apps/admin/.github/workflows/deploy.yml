name: Deploy Nuxt Admin to Server

on:
  push:
    branches: [main]

concurrency:
  group: deploy-admin-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust server host key (custom port)
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -p 9011 ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # همگام‌سازی تمیز با rsync (به‌جای rm -rf و scp)
      - name: Rsync project to server
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            -e "ssh -p 9011" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/admin

      # ساخت/به‌روزرسانی .env از روی Secrets (اگر نمی‌خوای .env روی سرور دستی نگه داری)
      - name: Create/refresh .env on server from GitHub Secrets
        run: |
          ssh -p 9011 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            cd /var/www/admin
            cat > .env <<EOT
            NUXT_PUBLIC_API_BASE=${{ secrets.NUXT_PUBLIC_API_BASE }}
            EOT
          EOF

      - name: Build & up via Docker Compose on server
        run: |
          ssh -p 9011 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            cd /var/www/admin


            docker compose down --remove-orphans || true


            docker ps --filter "publish=3001" -q | xargs -r docker stop
            docker ps -a --filter "publish=3001" -q | xargs -r docker rm


            docker compose build --no-cache
            docker compose up -d --force-recreate

            docker image prune -f || true
          EOF
