services:
  backend:
    container_name: vecaro-backend
    build: .
    image: vecaro-backend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - .env
    volumes:
      - /var/www/backend/vecaro-backend/uploads:/app/uploads
    networks:
      - vecaro-network

networks:
  vecaro-network:
    external: true