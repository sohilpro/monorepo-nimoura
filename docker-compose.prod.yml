services:
  postgres:
    image: docker.arvancloud.ir/postgres:16-alpine
    container_name: nimoura-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-nimoura}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nimoura-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-nimoura}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${REGISTRY_PREFIX:-local}/nimoura-api:latest
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://mirror-npm.runflare.com}
    container_name: nimoura-api
    restart: always
    env_file:
      - .env
    volumes:
      - uploads_data:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nimoura-net

  admin:
    image: ${REGISTRY_PREFIX:-local}/nimoura-admin:latest
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://mirror-npm.runflare.com}
    container_name: nimoura-admin
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3001
      - NUXT_ADMIN_API_BASE=http://api:4000/api/v1/admin
    depends_on:
      - api
    networks:
      - nimoura-net

  web:
    image: ${REGISTRY_PREFIX:-local}/nimoura-web:latest
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://mirror-npm.runflare.com}
    container_name: nimoura-web
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - NUXT_PUBLIC_API_BASE=https://api.nimoura.ir/api/v1
    depends_on:
      - api
    networks:
      - nimoura-net

  nginx:
    image: docker.arvancloud.ir/nginx:1.27-alpine
    container_name: nimoura-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - uploads_data:/var/www/uploads:ro
    depends_on:
      - api
      - admin
      - web
    networks:
      - nimoura-net

networks:
  nimoura-net:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
