services:
  postgres:
    image: docker.arvancloud.ir/postgres:16-alpine
    container_name: nimoura-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nimoura-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.arvancloud.ir/redis:7-alpine
    container_name: nimoura-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - nimoura-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${REGISTRY_PREFIX}/nimoura-api:latest
    container_name: nimoura-api
    restart: always
    env_file:
      - .env
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nimoura-net

  admin:
    image: ${REGISTRY_PREFIX}/nimoura-admin:latest
    container_name: nimoura-admin
    restart: always
    env_file:
      - .env
    environment:
      - NITRO_PORT=3000
      - NUXT_API_BASE_INTERNAL=http://api:4000
      - NUXT_PUBLIC_API_BASE=https://api.nimoura.ir
    depends_on:
      - api
    networks:
      - nimoura-net

  web:
    image: ${REGISTRY_PREFIX}/nimoura-web:latest
    container_name: nimoura-web
    restart: always
    env_file:
      - .env
    environment:
      - NITRO_PORT=3000
      - NUXT_API_BASE_INTERNAL=http://api:4000
      - NUXT_PUBLIC_API_BASE=https://api.nimoura.ir
    depends_on:
      - api
    networks:
      - nimoura-net

  nginx:
    image: docker.arvancloud.ir/nginx:1.27-alpine
    container_name: nimoura-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - uploads_data:/var/www/uploads:ro
    depends_on:
      - api
      - admin
    networks:
      - nimoura-net

  # <--- سرویس Watchtower اینجا قرار می‌گیرد --->
  watchtower:
    image: docker.arvancloud.ir/containrrr/watchtower:latest
    container_name: nimoura-watchtower
    restart: always
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json:ro
    command: --interval 120 --cleanup nimoura-api nimoura-admin nimoura-web
    networks:
      - nimoura-net

networks:
  nimoura-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data: