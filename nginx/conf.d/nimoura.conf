# ریدایرکت HTTP به HTTPS
server {
    listen 80;
    server_name nimoura.ir www.nimoura.ir admin.nimoura.ir api.nimoura.ir;
    return 301 https://$host$request_uri;
}

# ۱. سایت اصلی فروشگاه (nimoura.ir)
server {
    listen 443 ssl http2;
    server_name nimoura.ir www.nimoura.ir;

    ssl_certificate /etc/letsencrypt/live/nimoura.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nimoura.ir/privkey.pem;

    client_max_body_size 20M;

    # تصاویر آپلودی بکند:
    #  ۱. اول از volume مشترک روی دیسک سرو میشوند (سریع‌ترین حالت)
    #  ۲. اگر فایل روی دیسک نبود (مثلاً volume هنوز sync نشده یا
    #     فایل حذف شده)، درخواست به Nuxt فوروارد میشود تا از بکند
    #     پروکسی کند — به جای اینکه nginx مستقیم 404 بدهد.
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;

        # try_files:
        #   $uri       → فایل واقعی روی دیسک
        #   @web_proxy → اگر نبود، به Nuxt برو (Nuxt خودش از API پروکسی می‌کند)
        try_files $uri @web_proxy;
    }

    location @web_proxy {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ۲. پنل مدیریت (admin.nimoura.ir)
server {
    listen 443 ssl http2;
    server_name admin.nimoura.ir;

    ssl_certificate /etc/letsencrypt/live/nimoura.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nimoura.ir/privkey.pem;

    # ضروری برای آپلود فایل در پنل ادمین (server/api/upload.post.ts)
    client_max_body_size 50M;

    location / {
        proxy_pass http://admin:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ۳. بک‌اند NestJS (api.nimoura.ir)
server {
    listen 443 ssl http2;
    server_name api.nimoura.ir;

    ssl_certificate /etc/letsencrypt/live/nimoura.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nimoura.ir/privkey.pem;

    client_max_body_size 50M;

    # تصاویر آپلودی: اول از volume، اگر نبود به API fallback
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri @api_proxy;
    }

    location @api_proxy {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}