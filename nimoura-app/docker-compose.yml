# docker-compose.yml (نسخه خلاصه؛ نسخه کامل را از مستندات رسمی بگیرید)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis
  web:
    image: glitchtip/glitchtip
    depends_on: [postgres, redis]
    ports: ["8000:8000"]
    environment: &env
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      SECRET_KEY: یک-رشته-تصادفی-طولانی
      PORT: 8000
      GLITCHTIP_DOMAIN: https://errors.your-domain.ir
      DEFAULT_FROM_EMAIL: errors@your-domain.ir
  worker:
    image: glitchtip/glitchtip
    command: ./bin/run-celery-with-beat.sh
    depends_on: [postgres, redis]
    environment: *env
  migrate:
    image: glitchtip/glitchtip
    depends_on: [postgres, redis]
    command: ./manage.py migrate
    environment: *env
volumes:
  pgdata: